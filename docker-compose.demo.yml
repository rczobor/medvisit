# The on-prem demo (README: On-prem demo). It has its own Convex backend and
# volume, and publishes only the web server, on loopback; Tailscale serves it
# to the tailnet. Nothing here is reachable from the LAN.
name: medvisit-demo

services:
  convex-backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/convex/convex-backend@sha256:207cf95def42f01614b6e3af0af5c20d0dcaa5ff2adf258ee7bc9555576644fa}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    volumes:
      - convex-data:/convex/data
    environment:
      DISABLE_METRICS_ENDPOINT: "true"
      RUST_LOG: "${RUST_LOG:-info}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3210/version"]
      interval: 5s
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      convex-backend:
        condition: service_healthy
    environment:
      MEDVISIT_CONVEX_UPSTREAM: http://convex-backend:3210
      # For one-off `docker compose run web pnpm convex ...` commands; the
      # admin key is passed to those runs only, never kept in this service.
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
    ports:
      - "127.0.0.1:${MEDVISIT_DEMO_PORT:-3430}:3430"

volumes:
  convex-data:
